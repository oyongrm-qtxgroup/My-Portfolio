- id: qtx
  org: QTX (Qualiticks Pty Ltd)
  short: QTX
  place: Sydney, Australia (remote)
  title: Senior AI Software Engineer
  start: January 2026
  span: 2026–
  current: true
  summary: Lead engineer on Jayne Bandy AI, and AI, finance and workforce systems for Australian health, disability-care, aged-care and retirement-living clients.
  projects:
    - heading: Jayne Bandy AI — AI voice receptionist for dental practices; lead engineer since April 2026
      bullets:
        - Lead engineering of a live AI receptionist that answers and books calls for dental practices, covering voice quality, practice-system integrations and billing.
        - Integrated three practice-management systems (CareStack, Core Practice, Dentally) behind one receptionist script, matching callers to patient records by phone number.
        - Designed a review workflow that tests every script change against simulated and replayed real calls before approval, with version history and restore.
        - Added failure alerts and a 15-minute health check, so an AI-provider outage now raises an alert instead of going unnoticed.
        - Launched automatic trials, a premium tier with custom voices, Stripe subscription sync and per-country demo numbers.
    - heading: Workforce and care platform — provider under the National Disability Insurance Scheme (NDIS)
      bullets:
        - Built rostering, SCHADS award pay rates and penalties, timesheets, invoicing by funding type, and MYOB payroll and sales-journal export.
        - Rebuilt payment reconciliation so the system suggests a match for each payment line and Finance approves it; no invoice closes automatically.
        - Restricted every user to the records in their reach (own, team, site or program), enforced with row-level security in the database.
    - heading: Care-plan drafting — aged-care provider; technical lead
      bullets:
        - Specified a sprint for the development team and built AI drafting in which every statement cites its source page, with contradictions raised for a clinician to review.
        - Reduced the time per action from 6.5 seconds to about 1 second by moving the database connection to HTTPS.
    - heading: RL Finance — finance system for a retirement-village operator
      bullets:
        - Building a deferred management fee engine with Consumer Price Index (CPI) increases behind an approval step, matched to the client's own spreadsheet to the cent and kept as an automated test.
        - Delivered direct-debit files, period locking, and group profit-and-loss, balance-sheet and trial-balance reports across entities.
    - heading: Internal operations platform (Workable) and SEED AI agents
      bullets:
        - Added six modules to the company platform, covering marketing campaigns, certification tracking synced from Microsoft Learn, 30/60/90-day onboarding, key performance indicator (KPI) reviews, ad-audience sync and sales booking links.
        - Resolved recurring database-connection exhaustion by removing unfiltered real-time subscriptions.
        - Built a contract-management agent and a standalone e-signature flow with tenant isolation and retrieval-augmented chat.

