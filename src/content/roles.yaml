- id: qtx
  org: QTX (Qualiticks Pty Ltd)
  short: QTX
  place: Sydney, Australia (remote)
  title: Senior AI Software Engineer
  start: January 2026
  current: true
  summary: Lead engineer on Jayne Bandy AI and Ziaris; currently building SmartCP, AI care-plan drafting for an aged-care provider, and RL Finance for a retirement-village operator.
  projects:
    - heading: AI phone receptionist for dental practices (Jayne Bandy AI), lead engineer since April 2026
      bullets:
        - 'Lead engineering of the live receptionist: voice quality, practice-system integrations and billing.'
        - Integrated three practice-management systems (CareStack, Core Practice, Dentally) behind one receptionist script, matching callers to patient records by phone number and name.
        - Designed a review workflow that tests every script change against scripted scenarios and past calls, scored by an LLM judge, before admin approval, with version history and restore.
        - Added failure alerts and a 15-minute health check, so an AI-provider outage now raises an alert instead of going unnoticed.
        - Launched automatic trials, a premium tier with custom voices, Stripe subscription sync and per-country demo numbers.
    - heading: Ziaris, workforce and care platform for a National Disability Insurance Scheme (NDIS) provider
      bullets:
        - Built rostering, SCHADS award pay rates and penalties, timesheets, invoicing by funding type, and MYOB payroll and sales-journal export.
        - Rebuilt payment reconciliation so the system suggests a match for each payment line and Finance approves it; no invoice closes automatically.
        - Restricted every user to the records in their reach (own, team, site or program), enforced with row-level security in the database.
        - Built an Azure OpenAI assistant that answers staff questions inside the platform.
    - heading: SmartCP, AI care-plan drafting for an aged-care provider; technical lead
      bullets:
        - Specified a sprint for the development team and built AI drafting in which every statement cites its source page, with contradictions raised for a clinician to review.
        - Reduced the time per drafting action from 6.5 seconds to about 1 second by replacing a new direct database connection on every action with Supabase’s pooled HTTPS data API.
    - heading: RL Finance, finance system for a retirement-village operator
      bullets:
        - Building a deferred management fee engine with Consumer Price Index (CPI) increases behind an approval step, matched to the client’s own spreadsheet to the cent and kept as an automated test.
        - Delivered direct-debit files, period locking, and group profit-and-loss, balance-sheet and trial-balance reports across entities.
    - heading: Workable, QTX’s in-house operations platform
      bullets:
        - Added six modules, including certification tracking synced from Microsoft Learn, 30/60/90-day onboarding and key performance indicator (KPI) reviews.
        - Resolved recurring database-connection exhaustion by removing unfiltered real-time subscriptions.
        - Automated reporting and operational checks with Python scripts.
    - heading: SEED, QTX’s SaaS that brings specialised AI into the work a team already does
      bullets:
        - Built AI agents for contract management and document chat using retrieval-augmented generation (RAG), with tenant isolation and a standalone e-signature flow.

