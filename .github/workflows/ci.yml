name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint:design
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - run: npm run lint:denylist
        env:
          DENYLIST: ${{ secrets.DENYLIST }}
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      # The committed CV PDF must match the content and pass the Harvard checks.
      - run: npm run cv:pdf -- --check
